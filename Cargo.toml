[package]
name = "true-strike"
version = "0.1.0"
edition = "2024"

[dependencies]

# 条形码
bardecoder = "0.5.0"

# GUI
iced = "0.14.0"

# 摄像头
nokhwa = { version = "0.10.11", features = ["input-native", "output-threaded"] }

# 图像处理
opencv = { version = "0.99.0", default-features = false, features = [
  "clang-runtime",
] }
image = "0.25.10"
imageproc = "0.27.0"

rusqlite = "0.40.1"

# 异步
tokio = { version = "1.53.0", features = ["full"] }

# 日志
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
anyhow = "1.0.104"
thiserror = "2.0.20"
